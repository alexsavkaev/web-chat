name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run backend build and tests
        run: gradle :backend:build --no-daemon
      - name: Run PostgreSQL integration tests with Testcontainers
        run: gradle :backend:integrationTest --no-daemon

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend workspace
        run: |
          if [ ! -f frontend/package.json ]; then
            echo 'No frontend package.json yet; frontend workspace is a placeholder.'
            exit 0
          fi
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          else
            echo 'Frontend manifest exists but no supported lockfile was found.' >&2
            exit 1
          fi
          npm run build --if-present
          npm test --if-present
